[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evitrace-dfir"
version = "0.1.0"
description = "Local, proof-carrying forensic timeline verification prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7,<3",
  "z3-solver>=4.13,<5",
  "typer>=0.12,<0.16",
  "click>=8.1,<8.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7",
  "python-dateutil>=2.9,<3",
  "numpy>=2.1,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil>=2.9",
]

[project.scripts]
evitrace = "evitrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true
