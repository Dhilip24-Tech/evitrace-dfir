name: Feature request
description: Propose a change that fits the project's scope.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        EviTrace-DFIR is a local, proof-carrying analysis prototype. Proposals
        that add an LLM or network dependency to the analysis path, or that
        weaken the proof gate, are unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the analyst or developer need, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the project do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands, workarounds, or other designs you considered.
  - type: textarea
    id: proof
    attributes:
      label: Effect on the proof path
      description: |
        Does this change what can be accepted, what must abstain, or what a
        certificate contains? If so, describe the new evidence or predicate.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, sketches, or examples that help explain the request.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and documentation before opening this request.
          required: true
        - label: This request does not require sending real evidence or secrets.
          required: true
