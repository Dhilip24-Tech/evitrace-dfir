<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="social-title social-desc">
  <title id="social-title">EviTrace-DFIR — a forensic timeline that shows its work</title>
  <desc id="social-desc">Social preview. The Q1 download and process-start events are 3 seconds apart on one host; the claim is accepted with a signed certificate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1118"/>
      <stop offset="0.6" stop-color="#0C141D"/>
      <stop offset="1" stop-color="#101C29"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#2B5FA8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0B1118" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <g transform="translate(64 54)">
    <rect width="42" height="42" rx="11" fill="#111C29" stroke="#26374B"/>
    <path d="M13 11v20M13 11h16M13 21h11M13 31h16" fill="none" stroke="#EAF1FA" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="28" cy="21" r="2.4" fill="#4C8DFF"/>
  </g>
  <text class="sans" x="122" y="86" font-size="31" font-weight="700" fill="#F4F8FD" letter-spacing="-0.8">EviTrace</text>
  <text class="sans" x="274" y="86" font-size="13" font-weight="600" fill="#8FA3BA" letter-spacing="3">DFIR</text>

  <text class="sans" x="64" y="198" font-size="54" font-weight="600" fill="#F4F8FD" letter-spacing="-1.5">A forensic timeline</text>
  <text class="sans" x="64" y="260" font-size="54" font-weight="600" fill="#F4F8FD" letter-spacing="-1.5">that shows its work.</text>
  <text class="sans" x="64" y="316" font-size="18" fill="#A9B8C9">Every claim carries its proof, or abstains.</text>
  <text class="mono" x="64" y="358" font-size="11.5" fill="#7F93A9" letter-spacing="1.5">LOCAL-FIRST · Z3 INTERVALS · SIGNED CPCs · APACHE-2.0</text>

  <text class="mono" x="64" y="590" font-size="11.5" fill="#6F8399" letter-spacing="0.6">github.com/Dhilip24-Tech/evitrace-dfir</text>

  <g>
    <rect x="704" y="88" width="512" height="464" rx="20" fill="#0D1621" stroke="#223247"/>
    <rect x="704.5" y="88.5" width="511" height="463" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/>

    <text class="mono" x="736" y="126" font-size="11" fill="#7F93A9" letter-spacing="1.4">CASE-DEMO-2026 / Q1</text>
    <text class="mono" x="1184" y="126" font-size="11" fill="#7F93A9" text-anchor="end">±5 s bound</text>

    <text class="sans" x="736" y="166" font-size="17.5" font-weight="600" fill="#E8EFF8">Was invoice_q4.exe downloaded</text>
    <text class="sans" x="736" y="192" font-size="17.5" font-weight="600" fill="#E8EFF8">and executed on WKSTN-04?</text>

    <text class="mono" x="736" y="232" font-size="10.5" fill="#8FA3BA">WKSTN-04 · file download</text>
    <text class="mono" x="1184" y="232" font-size="10.5" fill="#7F93A9" text-anchor="end">10:00:00Z</text>
    <rect x="736" y="242" width="448" height="22" rx="4" fill="#17212D" stroke="#2A394B"/>
    <rect x="748" y="247" width="34" height="12" rx="2" fill="#C7D6E8"/>

    <text class="mono" x="736" y="300" font-size="10.5" fill="#8FA3BA">WKSTN-04 · process start</text>
    <text class="mono" x="1184" y="300" font-size="10.5" fill="#7F93A9" text-anchor="end">10:00:03Z</text>
    <rect x="736" y="310" width="448" height="22" rx="4" fill="#17212D" stroke="#2A394B"/>
    <rect x="860" y="315" width="34" height="12" rx="2" fill="#C7D6E8"/>

    <path d="M748 348H894" stroke="#6EA6FF" stroke-opacity="0.6" stroke-dasharray="4 5"/>
    <rect x="790" y="338" width="62" height="20" rx="10" fill="#0D1621" stroke="#2B5A8C"/>
    <text class="mono" x="821" y="352" font-size="10" fill="#9CC4FF" text-anchor="middle">3 s</text>

    <circle cx="744" cy="398" r="5" fill="#5EC08E"/>
    <text class="sans" x="758" y="405" font-size="21" font-weight="600" fill="#9BE3BD">ACCEPTED</text>
    <text class="sans" x="1184" y="403" font-size="11.5" fill="#8FA3BA" text-anchor="end">ENTAILED · same-host skew cancels</text>

    <line x1="736" y1="426" x2="1184" y2="426" stroke="#223247"/>

    <text class="mono" x="736" y="452" font-size="10" fill="#7F93A9" letter-spacing="1.2">SCORE</text>
    <text class="mono" x="1184" y="452" font-size="11" fill="#C7D6E8" text-anchor="end">s = 0.150 ≤ q-hat 0.420</text>

    <text class="mono" x="736" y="480" font-size="10" fill="#7F93A9" letter-spacing="1.2">SIGNATURE</text>
    <text class="mono" x="1184" y="480" font-size="11" fill="#C7D6E8" text-anchor="end">HS256 · key 80a02f75ef09df6f</text>

    <text class="mono" x="736" y="508" font-size="10" fill="#7F93A9" letter-spacing="1.2">CERTIFICATE</text>
    <text class="mono" x="1184" y="508" font-size="10" fill="#C7D6E8" text-anchor="end">cpc-CASE-DEMO-2026-run-…-2608</text>

    <text class="sans" x="736" y="534" font-size="10.5" fill="#6F8399">Captured local run · every value above comes from the CPC.</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
</svg>
