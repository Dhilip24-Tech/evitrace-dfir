<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">EviTrace-DFIR architecture</title>
  <desc id="arch-desc">Untrusted evidence exports pass through a sandbox, taint scanner and case store in a quarantined data plane. Normalized fields cross a one-way boundary into a deterministic control plane that plans, retrieves, checks, solves, calibrates and signs claims.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#8FA4BA"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#2456D8"/>
    </marker>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFDFF"/>
      <stop offset="1" stop-color="#F8FAFD"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 16px; font-weight: 600; fill: #172A3E; }
      .body { font-size: 12.2px; fill: #5E7389; }
      .micro { font-size: 10.5px; fill: #6B7F96; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>

  <text class="sans" x="72" y="72" font-size="32" font-weight="600" fill="#142334" letter-spacing="-0.7">System architecture</text>
  <text class="sans" x="72" y="103" font-size="14.5" fill="#5E7389">One case, one workspace. Untrusted evidence enters a quarantined data plane; only normalized records reach the control plane.</text>

  <!-- Data plane -->
  <rect x="48" y="132" width="1504" height="300" rx="16" fill="#F2F6FA" stroke="#DCE4EE"/>
  <text class="mono" x="76" y="168" font-size="11.5" fill="#4B6A8A" letter-spacing="2">QUARANTINED DATA PLANE</text>
  <text class="sans" x="282" y="168" font-size="12" fill="#7B8FA4">raw evidence text · instruction authority: none</text>

  <g>
    <rect x="76" y="202" width="300" height="188" rx="10" fill="#FFFFFF" stroke="#D8E1EC"/>
    <rect x="76" y="202" width="4" height="188" rx="2" fill="#9AAEC4"/>
    <text class="mono" x="352" y="226" font-size="10" fill="#8DA0B5" text-anchor="end">01</text>
    <text class="sans" x="94" y="234" font-size="16" font-weight="600" fill="#172A3E">Evidence exports</text>
    <text class="sans" x="94" y="266" font-size="12.2" fill="#5E7389">Plaso JSONL · EVTX JSONL</text>
    <text class="sans" x="94" y="288" font-size="12.2" fill="#5E7389">firewall CSV · canonical JSONL</text>
    <text class="sans" x="94" y="320" font-size="12.2" fill="#5E7389">read-only registration</text>
    <text class="mono" x="94" y="360" font-size="10.5" fill="#7C90A6">no rename · no rewrite</text>
  </g>
  <line x1="380" y1="296" x2="404" y2="296" stroke="#8FA4BA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="414" y="202" width="300" height="188" rx="10" fill="#FFFFFF" stroke="#D8E1EC"/>
    <rect x="414" y="202" width="4" height="188" rx="2" fill="#9AAEC4"/>
    <text class="mono" x="690" y="226" font-size="10" fill="#8DA0B5" text-anchor="end">02</text>
    <text class="sans" x="432" y="234" font-size="16" font-weight="600" fill="#172A3E">Sandbox</text>
    <text class="sans" x="432" y="266" font-size="12.2" fill="#5E7389">allowed roots · symlink-safe</text>
    <text class="sans" x="432" y="288" font-size="12.2" fill="#5E7389">250 MB file cap</text>
    <text class="sans" x="432" y="310" font-size="12.2" fill="#5E7389">1M character line cap</text>
    <text class="sans" x="432" y="342" font-size="12.2" fill="#5E7389">SHA-256 provenance</text>
  </g>
  <line x1="718" y1="296" x2="742" y2="296" stroke="#8FA4BA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="752" y="202" width="300" height="188" rx="10" fill="#FFFFFF" stroke="#D8E1EC"/>
    <rect x="752" y="202" width="4" height="188" rx="2" fill="#9AAEC4"/>
    <text class="mono" x="1028" y="226" font-size="10" fill="#8DA0B5" text-anchor="end">03</text>
    <text class="sans" x="770" y="234" font-size="16" font-weight="600" fill="#172A3E">Taint scanner</text>
    <text class="sans" x="770" y="266" font-size="12.2" fill="#5E7389">raw text preserved verbatim</text>
    <text class="sans" x="770" y="288" font-size="12.2" fill="#5E7389">injection markers flagged</text>
    <text class="sans" x="770" y="320" font-size="12.2" fill="#5E7389">IOC retained as evidence</text>
    <rect x="770" y="336" width="164" height="26" rx="13" fill="#F4F7FB" stroke="#D8E1EC"/>
    <text class="mono" x="852" y="353" font-size="10.5" fill="#526B84" text-anchor="middle">authority: none</text>
  </g>
  <line x1="1056" y1="296" x2="1080" y2="296" stroke="#8FA4BA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <g>
    <rect x="1090" y="202" width="414" height="188" rx="10" fill="#FFFFFF" stroke="#D8E1EC"/>
    <rect x="1090" y="202" width="4" height="188" rx="2" fill="#9AAEC4"/>
    <text class="mono" x="1480" y="226" font-size="10" fill="#8DA0B5" text-anchor="end">04</text>
    <text class="sans" x="1108" y="234" font-size="16" font-weight="600" fill="#172A3E">Case store</text>
    <text class="sans" x="1108" y="266" font-size="12.2" fill="#5E7389">one SQLite database per case · WAL + FTS5</text>
    <text class="sans" x="1108" y="288" font-size="12.2" fill="#5E7389">events · artifacts · runs · calibration · audit</text>
    <text class="sans" x="1108" y="310" font-size="12.2" fill="#5E7389">every read validated against case_id</text>
    <g class="mono" font-size="10.5">
      <rect x="1108" y="334" width="92" height="26" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
      <text x="1154" y="351" fill="#526B84" text-anchor="middle">case.json</text>
      <rect x="1210" y="334" width="84" height="26" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
      <text x="1252" y="351" fill="#526B84" text-anchor="middle">case.db</text>
      <rect x="1304" y="334" width="78" height="26" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
      <text x="1343" y="351" fill="#526B84" text-anchor="middle">key.bin</text>
      <rect x="1392" y="334" width="96" height="26" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
      <text x="1440" y="351" fill="#526B84" text-anchor="middle">HMAC-SHA256</text>
    </g>
  </g>

  <!-- Boundary -->
  <line x1="800" y1="436" x2="800" y2="444" stroke="#2456D8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <rect x="500" y="448" width="600" height="34" rx="17" fill="#FFFFFF" stroke="#BFD0E4"/>
  <text class="mono" x="800" y="470" font-size="11.5" fill="#31527A" text-anchor="middle">ONE-WAY BOUNDARY · normalized fields only · no instruction channel</text>
  <line x1="800" y1="486" x2="800" y2="496" stroke="#2456D8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Control plane -->
  <rect x="48" y="504" width="1504" height="420" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/>
  <text class="mono" x="76" y="540" font-size="11.5" fill="#1F4FB8" letter-spacing="2">DETERMINISTIC CONTROL PLANE</text>
  <text class="sans" x="326" y="540" font-size="12" fill="#7B8FA4">planned, checked, calibrated, signed</text>

  <g>
    <rect x="76" y="580" width="220" height="188" rx="10" fill="#FBFCFE" stroke="#D8E1EC"/>
    <rect x="76" y="580" width="4" height="188" rx="2" fill="#2456D8"/>
    <text class="mono" x="278" y="604" font-size="10" fill="#8DA0B5" text-anchor="end">01</text>
    <text class="sans" x="94" y="612" font-size="15.5" font-weight="600" fill="#172A3E">Question planner</text>
    <text class="sans" x="94" y="644" font-size="12.2" fill="#5E7389">fixed question patterns</text>
    <text class="sans" x="94" y="666" font-size="12.2" fill="#5E7389">claim + cited events</text>
    <text class="sans" x="94" y="688" font-size="12.2" fill="#5E7389">case-scoped reads</text>
  </g>
  <line x1="300" y1="674" x2="314" y2="674" stroke="#2456D8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="320" y="580" width="220" height="188" rx="10" fill="#FBFCFE" stroke="#D8E1EC"/>
    <rect x="320" y="580" width="4" height="188" rx="2" fill="#2456D8"/>
    <text class="mono" x="522" y="604" font-size="10" fill="#8DA0B5" text-anchor="end">02</text>
    <text class="sans" x="338" y="612" font-size="15.5" font-weight="600" fill="#172A3E">Hybrid retrieval</text>
    <text class="sans" x="338" y="644" font-size="12.2" fill="#5E7389">FTS5 BM25</text>
    <text class="sans" x="338" y="666" font-size="12.2" fill="#5E7389">exact IOC/path boost</text>
    <text class="sans" x="338" y="688" font-size="12.2" fill="#5E7389">bounded cosine fallback</text>
  </g>
  <line x1="544" y1="674" x2="558" y2="674" stroke="#2456D8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="564" y="580" width="220" height="188" rx="10" fill="#FBFCFE" stroke="#D8E1EC"/>
    <rect x="564" y="580" width="4" height="188" rx="2" fill="#2456D8"/>
    <text class="mono" x="766" y="604" font-size="10" fill="#8DA0B5" text-anchor="end">03</text>
    <text class="sans" x="582" y="612" font-size="15.5" font-weight="600" fill="#172A3E">Witness checks</text>
    <text class="sans" x="582" y="644" font-size="12.2" fill="#5E7389">field witnesses</text>
    <text class="sans" x="582" y="666" font-size="12.2" fill="#5E7389">required predicates</text>
    <text class="sans" x="582" y="688" font-size="12.2" fill="#5E7389">missing evidence named</text>
  </g>
  <line x1="788" y1="674" x2="802" y2="674" stroke="#2456D8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="808" y="580" width="220" height="188" rx="10" fill="#FBFCFE" stroke="#D8E1EC"/>
    <rect x="808" y="580" width="4" height="188" rx="2" fill="#2456D8"/>
    <text class="mono" x="1010" y="604" font-size="10" fill="#8DA0B5" text-anchor="end">04</text>
    <text class="sans" x="826" y="612" font-size="15.5" font-weight="600" fill="#172A3E">Temporal model</text>
    <text class="sans" x="826" y="644" font-size="12.2" fill="#5E7389">Z3 interval algebra</text>
    <text class="sans" x="826" y="666" font-size="12.2" fill="#5E7389">per-host clock skew</text>
    <text class="sans" x="826" y="688" font-size="12.2" fill="#5E7389">unsat core on conflict</text>
  </g>
  <line x1="1032" y1="674" x2="1046" y2="674" stroke="#2456D8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="1052" y="580" width="220" height="188" rx="10" fill="#FBFCFE" stroke="#D8E1EC"/>
    <rect x="1052" y="580" width="4" height="188" rx="2" fill="#2456D8"/>
    <text class="mono" x="1254" y="604" font-size="10" fill="#8DA0B5" text-anchor="end">05</text>
    <text class="sans" x="1070" y="612" font-size="15.5" font-weight="600" fill="#172A3E">Selective answer</text>
    <text class="sans" x="1070" y="644" font-size="12.2" fill="#5E7389">nonconformity score s</text>
    <text class="sans" x="1070" y="666" font-size="12.2" fill="#5E7389">s ≤ q-hat → accept</text>
    <text class="sans" x="1070" y="688" font-size="12.2" fill="#5E7389">otherwise abstain</text>
  </g>
  <line x1="1276" y1="674" x2="1290" y2="674" stroke="#2456D8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="1296" y="580" width="220" height="188" rx="10" fill="#FBFCFE" stroke="#D8E1EC"/>
    <rect x="1296" y="580" width="4" height="188" rx="2" fill="#2456D8"/>
    <text class="mono" x="1498" y="604" font-size="10" fill="#8DA0B5" text-anchor="end">06</text>
    <text class="sans" x="1314" y="612" font-size="15.5" font-weight="600" fill="#172A3E">Signed CPC</text>
    <text class="sans" x="1314" y="644" font-size="12.2" fill="#5E7389">HMAC-SHA256</text>
    <text class="sans" x="1314" y="666" font-size="12.2" fill="#5E7389">JSON + Markdown report</text>
    <text class="sans" x="1314" y="688" font-size="12.2" fill="#5E7389">tamper-evident</text>
  </g>

  <!-- Outputs -->
  <text class="mono" x="76" y="814" font-size="10.5" fill="#7B8FA4" letter-spacing="1.6">SURFACES</text>
  <g class="mono" font-size="11">
    <rect x="176" y="794" width="300" height="30" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
    <text x="192" y="813" fill="#31527A">evitrace ask --compact</text>
    <rect x="492" y="794" width="300" height="30" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
    <text x="508" y="813" fill="#31527A">case-demo-2026-report.md</text>
    <rect x="808" y="794" width="300" height="30" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
    <text x="824" y="813" fill="#31527A">case-demo-2026-cpc.json</text>
    <rect x="1124" y="794" width="300" height="30" rx="6" fill="#F4F7FB" stroke="#D8E1EC"/>
    <text x="1140" y="813" fill="#31527A">POST /v1/cases/{id}/ask</text>
  </g>

  <!-- Verdicts -->
  <line x1="76" y1="852" x2="1516" y2="852" stroke="#E6ECF4"/>
  <g class="mono" font-size="10.5">
    <circle cx="82" cy="878" r="4" fill="#2F7D5A"/>
    <text x="94" y="882" fill="#3E5A50">ACCEPTED</text>
    <circle cx="434" cy="878" r="4" fill="#2456D8"/>
    <text x="446" y="882" fill="#31527A">QUALIFIED_HYPOTHESIS</text>
    <circle cx="786" cy="878" r="4" fill="#A66A1F"/>
    <text x="798" y="882" fill="#6F5836">ABSTAIN_INSUFFICIENT_EVIDENCE</text>
    <circle cx="1286" cy="878" r="4" fill="#A33A3A"/>
    <text x="1298" y="882" fill="#6E4141">REJECTED</text>
  </g>
  <text class="sans" x="76" y="958" font-size="12.2" fill="#6B7F96">Separation is structural: the planner reads normalized fields and retrieval hits, never raw instruction text. Each accepted claim carries a signed proof; unsupported claims abstain.</text>
</svg>
