<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">EviTrace-DFIR — forensic timelines that carry their proof</title>
  <desc id="banner-desc">Project banner. A Q2 clock-skew panel shows two overlapping time intervals and a qualified hypothesis verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1118"/>
      <stop offset="0.58" stop-color="#0C141D"/>
      <stop offset="1" stop-color="#101B27"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.76" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#2B5FA8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0B1118" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <rect width="1600" height="420" fill="url(#halo)"/>

  <g transform="translate(80 72)">
    <rect width="48" height="48" rx="13" fill="#111C29" stroke="#26374B"/>
    <path d="M15 13v22M15 13h18M15 24h13M15 35h18" fill="none" stroke="#EAF1FA" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="32" cy="24" r="2.8" fill="#4C8DFF"/>
  </g>
  <text class="sans" x="146" y="106" font-size="35" font-weight="700" fill="#F4F8FD" letter-spacing="-0.9">EviTrace</text>
  <text class="sans" x="312" y="106" font-size="15" font-weight="600" fill="#8FA3BA" letter-spacing="3.4">DFIR</text>

  <text class="sans" x="80" y="203" font-size="43" font-weight="600" fill="#F4F8FD" letter-spacing="-1.25">Forensic timelines that</text>
  <text class="sans" x="80" y="253" font-size="43" font-weight="600" fill="#F4F8FD" letter-spacing="-1.25">carry their proof.</text>
  <text class="sans" x="80" y="299" font-size="17" fill="#A9B8C9">Ask a case a question. Get a claim with its proof, or a stated gap.</text>

  <g class="mono" font-size="11.5" fill="#7F93A9" letter-spacing="1.5">
    <text x="80" y="369">LOCAL-FIRST</text>
    <text x="226" y="369">Z3 INTERVALS</text>
    <text x="390" y="369">SIGNED CPCs</text>
    <text x="540" y="369">APACHE-2.0</text>
  </g>
  <g fill="#2A3A4D">
    <circle cx="198" cy="365" r="2"/>
    <circle cx="362" cy="365" r="2"/>
    <circle cx="512" cy="365" r="2"/>
  </g>

  <g>
    <rect x="880" y="48" width="640" height="324" rx="18" fill="#0D1621" stroke="#223247"/>
    <rect x="880.5" y="48.5" width="639" height="323" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/>

    <text class="mono" x="912" y="86" font-size="11.5" fill="#7F93A9" letter-spacing="1.4">CASE-DEMO-2026 / Q2</text>
    <text class="mono" x="1488" y="86" font-size="11.5" fill="#7F93A9" text-anchor="end">±5 s</text>

    <text class="sans" x="912" y="128" font-size="18" font-weight="600" fill="#E8EFF8">Did WKSTN-04 connect before</text>
    <text class="sans" x="912" y="154" font-size="18" font-weight="600" fill="#E8EFF8">FW-EDGE-01 logged the block?</text>

    <text class="mono" x="912" y="190" font-size="11" fill="#8FA3BA">WKSTN-04 · process start</text>
    <text class="mono" x="1488" y="190" font-size="11" fill="#7F93A9" text-anchor="end">10:00:03Z</text>
    <rect x="912" y="200" width="560" height="24" rx="4" fill="#17212D" stroke="#2A394B"/>
    <rect x="1128" y="206" width="48" height="12" rx="2" fill="#C7D6E8"/>

    <text class="mono" x="912" y="255" font-size="11" fill="#8FA3BA">FW-EDGE-01 · firewall block</text>
    <text class="mono" x="1488" y="255" font-size="11" fill="#7F93A9" text-anchor="end">10:00:06Z</text>
    <rect x="1012" y="265" width="460" height="24" rx="4" fill="#10243A" stroke="#2F5F92"/>
    <rect x="1170" y="271" width="48" height="12" rx="2" fill="#4C8DFF"/>

    <path d="M1012 308H1300" stroke="#6EA6FF" stroke-opacity="0.7" stroke-dasharray="4 5"/>
    <rect x="1104" y="296" width="112" height="24" rx="12" fill="#0D1621" stroke="#2B5A8C"/>
    <text class="mono" x="1160" y="312" font-size="11" fill="#9CC4FF" text-anchor="middle">8 s overlap</text>

    <rect x="912" y="330" width="250" height="32" rx="16" fill="#112A4D" stroke="#2C5C92"/>
    <text class="mono" x="1037" y="350" font-size="10.5" fill="#A9CCFF" text-anchor="middle" letter-spacing="1.2">QUALIFIED HYPOTHESIS</text>
    <text class="sans" x="1488" y="350" font-size="11.5" fill="#7F93A9" text-anchor="end">will not assert “before”</text>
  </g>

  <rect x="0.5" y="0.5" width="1599" height="419" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
</svg>
